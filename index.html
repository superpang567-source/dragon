<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>團購接龍 · 阿邦團購</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }
        .app {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            padding: 20px 16px 24px;
            margin-top: 10px;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .product-card {
            background: #ffffff;
            border: 2px solid #e9edf2;
            border-radius: 20px;
            overflow: hidden;
            transition: 0.2s;
        }
        .product-card.active {
            border-color: #2563eb;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.12);
        }
        .product-card.expired {
            border-color: #ef4444;
            opacity: 0.7;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            background: #fafcff;
            transition: 0.15s;
            flex-wrap: wrap;
            gap: 6px;
        }
        .product-header:active { background: #f1f5f9; }

        .product-header .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }
        .product-header .name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
        }
        .product-header .price {
            font-size: 0.85rem;
            font-weight: 600;
            color: #dc2626;
        }
        .product-header .price small {
            font-weight: 400;
            color: #94a3b8;
        }

        .product-header .right-area {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .product-countdown {
            font-size: 0.8rem;
            font-weight: 700;
            color: #2563eb;
            background: #dbeafe;
            padding: 2px 12px;
            border-radius: 40px;
            white-space: nowrap;
        }
        .product-countdown.expired {
            color: #ef4444;
            background: #fee2e2;
        }

        .product-header .badge {
            font-size: 0.75rem;
            background: #dbeafe;
            color: #2563eb;
            padding: 2px 12px;
            border-radius: 40px;
            font-weight: 600;
        }
        .product-header .toggle-icon {
            font-size: 1.3rem;
            color: #94a3b8;
            transition: 0.2s;
        }
        .product-card.active .toggle-icon {
            transform: rotate(180deg);
            color: #2563eb;
        }

        .set-countdown-btn {
            background: #f1f5f9;
            border: none;
            border-radius: 40px;
            padding: 2px 10px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #475569;
        }
        .set-countdown-btn:active { background: #e2e8f0; }

        .product-body {
            display: none;
            padding: 0 16px 16px 16px;
            border-top: 1px solid #e9edf2;
            background: #fafcff;
        }
        .product-card.active .product-body {
            display: block;
        }

        .product-body .stats-mini {
            display: flex;
            gap: 12px;
            padding: 10px 0 8px 0;
            font-size: 0.8rem;
            color: #64748b;
            flex-wrap: wrap;
        }
        .product-body .stats-mini span { background: #f1f5f9; padding: 2px 12px; border-radius: 40px; }

        .product-body .add-form {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .product-body .add-form input {
            flex: 1;
            min-width: 60px;
            padding: 10px 14px;
            border: 1.5px solid #e9edf2;
            border-radius: 60px;
            font-size: 0.9rem;
            background: #ffffff;
            outline: none;
        }
        .product-body .add-form input:focus { border-color: #2563eb; }
        .product-body .add-form input[type="number"] { max-width: 70px; text-align: center; }
        .product-body .add-form button {
            padding: 10px 16px;
            background: #2563eb;
            border: none;
            color: white;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .product-body .add-form button:active { background: #1d4ed8; transform: scale(0.95); }
        .product-body .add-form button:disabled { background: #94a3b8; cursor: not-allowed; }

        .product-body .order-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 200px;
            overflow-y: auto;
        }
        .product-body .order-list li {
            background: #ffffff;
            border: 1px solid #edf2f7;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .product-body .order-list .o-name { font-weight: 600; flex: 1; min-width: 40px; }
        .product-body .order-list .o-qty { background: #dbeafe; color: #2563eb; padding: 0 10px; border-radius: 40px; font-weight: 600; font-size: 0.8rem; }
        .product-body .order-list .o-amount { background: #fef3c7; color: #92400e; padding: 0 10px; border-radius: 40px; font-weight: 600; font-size: 0.8rem; }
        .product-body .order-list .o-del { background: none; border: none; color: #b91c1c; font-size: 1rem; cursor: pointer; padding: 0 4px; }
        .product-body .order-list .o-del:active { transform: scale(0.85); }

        .product-body .empty-msg {
            text-align: center;
            padding: 16px 0;
            color: #a0aec0;
            font-size: 0.85rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 1.3rem; font-weight: 700; color: #1e293b; }
        .sync-status { font-size: 0.7rem; color: #22c55e; }
        .sync-status.syncing { color: #f59e0b; }
        .sync-status.error { color: #ef4444; }

        .dropdown-wrapper { position: relative; display: inline-block; }
        .dropdown-btn { background: #f1f5f9; border: none; padding: 6px 12px; border-radius: 40px; font-size: 1.1rem; cursor: pointer; }
        .dropdown-btn:active { transform: scale(0.92); }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: white;
            min-width: 160px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            z-index: 100;
            padding: 6px 0;
            border: 1px solid #e9edf2;
        }
        .dropdown-content.active { display: block; }
        .dropdown-content button {
            display: block;
            width: 100%;
            padding: 8px 16px;
            border: none;
            background: none;
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            color: #1e293b;
        }
        .dropdown-content button:active { background: #f1f5f9; }
        .dropdown-content .divider { height: 1px; background: #e9edf2; margin: 4px 12px; }

        .countdown-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .countdown-modal.active { display: flex; }
        .countdown-modal .modal-content {
            background: white;
            border-radius: 32px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
        }
        .countdown-modal .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .countdown-modal .modal-sub { font-size: 0.85rem; color: #64748b; margin-bottom: 16px; }
        .countdown-modal .modal-body { display: flex; flex-direction: column; gap: 12px; }
        .countdown-modal .modal-body input {
            padding: 12px 16px;
            border: 1.5px solid #e9edf2;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }
        .countdown-modal .modal-body input:focus { border-color: #2563eb; }
        .countdown-modal .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .countdown-modal .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .countdown-modal .modal-actions .btn-confirm { background: #2563eb; color: white; }
        .countdown-modal .modal-actions .btn-confirm:active { background: #1d4ed8; }
        .countdown-modal .modal-actions .btn-cancel { background: #f1f5f9; color: #475569; }
        .countdown-modal .modal-actions .btn-cancel:active { background: #e2e8f0; }

        .order-list::-webkit-scrollbar { width: 3px; }
        .order-list::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 20px; }
        .order-list::-webkit-scrollbar-thumb { background: #d1d9e6; border-radius: 20px; }

        @media (max-width: 420px) {
            .product-body .add-form { flex-direction: column; }
            .product-body .add-form input[type="number"] { max-width: 100%; }
            .product-header { flex-direction: column; align-items: stretch; }
            .product-header .right-area { justify-content: flex-start; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- 標題 -->
    <div class="header">
        <h1>🛒 團購接龍</h1>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="sync-status" id="syncStatus">● 已同步</span>
            <div class="dropdown-wrapper">
                <button class="dropdown-btn" id="dropdownBtn">⚙️</button>
                <div class="dropdown-content" id="dropdownContent">
                    <button id="resetBtn">⟳ 重置全部</button>
                    <div class="divider"></div>
                    <button id="exportBtn">📤 匯出</button>
                    <button id="importBtn">📥 匯入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 商品列表 -->
    <div class="product-list" id="productList"></div>

    <!-- 倒數設定視窗 -->
    <div class="countdown-modal" id="countdownModal">
        <div class="modal-content">
            <div class="modal-title">⏰ 設定倒數</div>
            <div class="modal-sub" id="modalProductName">商品名稱</div>
            <div class="modal-body">
                <input type="datetime-local" id="countdownDate">
                <div style="font-size:0.75rem; color:#94a3b8; margin-top:-4px;">💡 設定截止時間，時間到自動關閉接龍</div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">取消</button>
                <button class="btn-confirm" id="modalConfirm">設定</button>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <div style="text-align:center; font-size:0.7rem; color:#b9c1cc; border-top:1px solid #f1f5f9; padding-top:12px; margin-top:4px;">
        點擊商品展開接龍 · 每樣商品獨立倒數
    </div>
</div>

<script>
    (function() {
        "use strict";

        const API_URL = 'https://script.google.com/macros/s/AKfycbx0C8vqtfvtAgoA8cL58aFzGNIqiS-V_zXgvgxe7oqnkQSBBcRpkPYtgWvagYD2HtbYAg/exec';

        // ===== 商品清單 =====
        const PRODUCTS = [
            { id: 'p1', name: '🥯 滿滿起司貝果', price: 120, unit: 3 },
            { id: 'p2', name: '🍞 香蒜軟法', price: 150, unit: 2 },
            { id: 'p3', name: '🧀 雙倍起司吐司', price: 180, unit: 1 },
        ];

        // ===== 每個商品的倒數狀態 =====
        let productCountdowns = {};
        let isExpiredMap = {};

        // ===== 狀態 =====
        let allOrders = [];
        let isLoading = false;
        let activeProductId = null;

        // ===== DOM =====
        const productListEl = document.getElementById('productList');
        const syncStatus = document.getElementById('syncStatus');
        const dropdownBtn = document.getElementById('dropdownBtn');
        const dropdownContent = document.getElementById('dropdownContent');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');

        const countdownModal = document.getElementById('countdownModal');
        const countdownDate = document.getElementById('countdownDate');
        const modalProductName = document.getElementById('modalProductName');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');
        let settingProductId = null;

        // ===== 下拉選單 =====
        dropdownBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdownContent.classList.toggle('active'); });
        document.addEventListener('click', () => dropdownContent.classList.remove('active'));

        // ===== API =====
        async function apiCall(action, params = {}) {
            const url = new URL(API_URL);
            url.searchParams.append('action', action);
            Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
            try {
                const res = await fetch(url.toString());
                return await res.json();
            } catch (e) { return { success: false, error: e.message }; }
        }

        // ===== 載入 =====
        async function loadOrders() {
            if (isLoading) return;
            isLoading = true;
            syncStatus.textContent = '● 同步中';
            syncStatus.className = 'sync-status syncing';
            try {
                const result = await apiCall('getOrders');
                if (result.success && result.orders) {
                    allOrders = result.orders;
                    render();
                    syncStatus.textContent = '● 已同步';
                    syncStatus.className = 'sync-status';
                } else {
                    syncStatus.textContent = '● 錯誤';
                    syncStatus.className = 'sync-status error';
                }
            } catch (e) {
                syncStatus.textContent = '● 錯誤';
                syncStatus.className = 'sync-status error';
            }
            isLoading = false;
        }

        // ===== 新增 =====
        async function addOrder(productId, name, community, quantity) {
            if (isExpiredMap[productId]) {
                alert('⏰ 此商品已截止，無法新增訂單');
                return false;
            }

            const trimmedName = name.trim();
            const trimmedCommunity = community.trim();
            if (!trimmedName || !trimmedCommunity) return false;
            if (quantity < 1 || quantity > 99) return false;

            const btn = document.querySelector(`#add-btn-${productId}`);
            if (btn) btn.disabled = true;

            try {
                const result = await apiCall('addOrder', {
                    productId: productId,
                    name: trimmedName,
                    community: trimmedCommunity,
                    quantity: quantity
                });
                if (result.success) {
                    await loadOrders();
                    return true;
                } else {
                    alert('新增失敗: ' + (result.error || '請稍後再試'));
                    return false;
                }
            } catch (e) { alert('網路錯誤'); return false; }
            finally { if (btn) btn.disabled = false; }
        }

        // ===== 刪除 =====
        async function deleteOrder(id) {
            try {
                const result = await apiCall('deleteOrder', { id });
                if (result.success) await loadOrders();
                else alert('刪除失敗');
            } catch (e) { alert('網路錯誤'); }
        }

        // ===== 重置 =====
        async function resetAll() {
            if (allOrders.length === 0) return;
            if (!confirm('確定要清空所有訂單嗎？')) return;
            try {
                await apiCall('reset');
                await loadOrders();
                dropdownContent.classList.remove('active');
            } catch (e) { alert('網路錯誤'); }
        }

        // ===== 商品倒數計時 =====
        function startProductCountdown(productId) {
            const data = productCountdowns[productId];
            if (!data || !data.endTime) return;
            
            if (data.interval) {
                clearInterval(data.interval);
            }

            updateProductCountdownDisplay(productId);
            data.interval = setInterval(() => {
                updateProductCountdownDisplay(productId);
            }, 1000);
        }

        function updateProductCountdownDisplay(productId) {
            const data = productCountdowns[productId];
            if (!data || !data.endTime) {
                updateCountdownElement(productId, '--:--:--', false);
                return;
            }

            const diff = data.endTime - new Date();
            if (diff <= 0) {
                isExpiredMap[productId] = true;
                updateCountdownElement(productId, '⏰ 已截止', true);
                if (data.interval) {
                    clearInterval(data.interval);
                    data.interval = null;
                }
                render();
                return;
            }

            isExpiredMap[productId] = false;
            const h = String(Math.floor(diff / (1000*60*60))).padStart(2,'0');
            const m = String(Math.floor((diff % (1000*60*60)) / (1000*60))).padStart(2,'0');
            const s = String(Math.floor((diff % (1000*60)) / 1000)).padStart(2,'0');
            updateCountdownElement(productId, `${h}:${m}:${s}`, false);
        }

        function updateCountdownElement(productId, text, isExpired) {
            const el = document.querySelector(`#countdown-${productId}`);
            if (el) {
                el.textContent = text;
                el.className = 'product-countdown' + (isExpired ? ' expired' : '');
            }
        }

        function setProductCountdown(productId, dateTime) {
            const target = new Date(dateTime);
            if (isNaN(target.getTime()) || target <= new Date()) {
                alert('請選擇未來的時間');
                return;
            }

            if (productCountdowns[productId] && productCountdowns[productId].interval) {
                clearInterval(productCountdowns[productId].interval);
            }

            productCountdowns[productId] = {
                endTime: target,
                interval: null
            };
            isExpiredMap[productId] = false;
            
            saveCountdownsToStorage();
            startProductCountdown(productId);
            render();
            countdownModal.classList.remove('active');
        }

        function saveCountdownsToStorage() {
            const data = {};
            Object.keys(productCountdowns).forEach(key => {
                if (productCountdowns[key] && productCountdowns[key].endTime) {
                    data[key] = productCountdowns[key].endTime.toISOString();
                }
            });
            localStorage.setItem('productCountdowns', JSON.stringify(data));
        }

        function loadCountdownsFromStorage() {
            try {
                const raw = localStorage.getItem('productCountdowns');
                if (!raw) return;
                const data = JSON.parse(raw);
                Object.keys(data).forEach(key => {
                    const endTime = new Date(data[key]);
                    if (endTime > new Date()) {
                        productCountdowns[key] = { endTime: endTime, interval: null };
                        isExpiredMap[key] = false;
                    } else {
                        isExpiredMap[key] = true;
                    }
                });
            } catch (_) {}
        }

        // ===== 匯出 / 匯入 =====
        function exportData() {
            if (allOrders.length === 0) { alert('清單是空的'); return; }
            const data = JSON.stringify({ 
                orders: allOrders, 
                countdowns: productCountdowns,
                exportedAt: new Date().toISOString() 
            }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `團購訂單-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            dropdownContent.classList.remove('active');
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.orders && Array.isArray(data.orders)) {
                            if (confirm(`將匯入 ${data.orders.length} 個項目，是否取代目前清單？`)) {
                                await apiCall('reset');
                                for (const o of data.orders) {
                                    await apiCall('addOrder', {
                                        productId: o.productId || 'p1',
                                        name: o.name,
                                        community: o.community || '未填寫',
                                        quantity: o.quantity
                                    });
                                }
                                if (data.countdowns) {
                                    Object.keys(data.countdowns).forEach(key => {
                                        const endTime = new Date(data.countdowns[key]);
                                        if (endTime > new Date()) {
                                            productCountdowns[key] = { endTime: endTime, interval: null };
                                            isExpiredMap[key] = false;
                                        }
                                    });
                                    saveCountdownsToStorage();
                                }
                                await loadOrders();
                                alert('匯入成功！');
                            }
                        } else { alert('檔案格式錯誤'); }
                    } catch (_) { alert('無法讀取檔案'); }
                };
                reader.readAsText(file);
            };
            input.click();
            dropdownContent.classList.remove('active');
        }

        // ===== 切換商品展開 =====
        function toggleProduct(productId) {
            if (activeProductId === productId) {
                activeProductId = null;
            } else {
                activeProductId = productId;
            }
            render();
        }

        // ===== 打開倒數設定視窗 =====
        function openCountdownModal(productId) {
            settingProductId = productId;
            const product = PRODUCTS.find(p => p.id === productId);
            modalProductName.textContent = product ? product.name : '';

            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(20, 0, 0, 0);
            const y = tomorrow.getFullYear();
            const m = String(tomorrow.getMonth()+1).padStart(2,'0');
            const d = String(tomorrow.getDate()).padStart(2,'0');
            const h = String(tomorrow.getHours()).padStart(2,'0');
            const min = String(tomorrow.getMinutes()).padStart(2,'0');
            countdownDate.value = `${y}-${m}-${d}T${h}:${min}`;

            countdownModal.classList.add('active');
        }

        // ===== 渲染 =====
        function render() {
            // 啟動所有商品的倒數
            Object.keys(productCountdowns).forEach(key => {
                const data = productCountdowns[key];
                if (data && data.endTime && !data.interval) {
                    startProductCountdown(key);
                }
            });

            productListEl.innerHTML = '';
            PRODUCTS.forEach(p => {
                const orders = allOrders.filter(o => o.productId === p.id);
                const qty = orders.reduce((s, o) => s + o.quantity, 0);
                const amt = qty * p.price;
                const isActive = (activeProductId === p.id);
                const isExpired = isExpiredMap[p.id] || false;
                const hasCountdown = productCountdowns[p.id] && productCountdowns[p.id].endTime;

                const card = document.createElement('div');
                card.className = 'product-card' + (isActive ? ' active' : '') + (isExpired ? ' expired' : '');

                const header = document.createElement('div');
                header.className = 'product-header';
                
                let countdownText = '--:--:--';
                if (hasCountdown) {
                    const diff = productCountdowns[p.id].endTime - new Date();
                    if (diff <= 0) {
                        countdownText = '⏰ 已截止';
                    } else {
                        const h = String(Math.floor(diff / (1000*60*60))).padStart(2,'0');
                        const m = String(Math.floor((diff % (1000*60*60)) / (1000*60))).padStart(2,'0');
                        const s = String(Math.floor((diff % (1000*60)) / 1000)).padStart(2,'0');
                        countdownText = `${h}:${m}:${s}`;
                    }
                }

                header.innerHTML = `
                    <div class="info">
                        <div class="name">${p.name}</div>
                        <div class="price">$${p.price} <small>/ ${p.unit}個</small></div>
                    </div>
                    <div class="right-area">
                        <span class="product-countdown ${isExpired ? 'expired' : ''}" id="countdown-${p.id}">${countdownText}</span>
                        <button class="set-countdown-btn" data-id="${p.id}">⏰</button>
                        <span class="badge">${orders.length}人 / ${qty}組</span>
                        <span class="toggle-icon">${isActive ? '▾' : '▸'}</span>
                    </div>
                `;

                const setBtn = header.querySelector('.set-countdown-btn');
                setBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openCountdownModal(p.id);
                });

                header.addEventListener('click', () => toggleProduct(p.id));

                const body = document.createElement('div');
                body.className = 'product-body';
                body.innerHTML = `
                    <div class="stats-mini">
                        <span>👤 ${orders.length} 人</span>
                        <span>📦 ${qty} 組</span>
                        <span>💰 $${amt}</span>
                        ${isExpired ? '<span style="color:#ef4444;">⏰ 已截止</span>' : ''}
                    </div>
                    <form class="add-form" id="form-${p.id}">
                        <input type="text" placeholder="姓名" class="name-input" required>
                        <input type="text" placeholder="社區" class="community-input" required>
                        <input type="number" placeholder="組數" value="1" min="1" max="99" class="qty-input">
                        <button type="submit" id="add-btn-${p.id}" ${isExpired ? 'disabled' : ''}>＋ 加入</button>
                    </form>
                    <ul class="order-list" id="ol-${p.id}">
                        ${orders.length === 0 ? '<div class="empty-msg">🛒 還沒有訂單</div>' : ''}
                    </ul>
                `;

                const ol = body.querySelector('.order-list');
                if (orders.length > 0) {
                    orders.forEach((o, idx) => {
                        const li = document.createElement('li');
                        const personalAmount = o.quantity * p.price;
                        li.innerHTML = `
                            <span style="color:#94a3b8; font-size:0.7rem; min-width:22px;">#${idx+1}</span>
                            <span class="o-name">${o.name}</span>
                            <span style="font-size:0.7rem; color:#64748b; background:#f1f5f9; padding:0 8px; border-radius:40px;">${o.community || '未填寫'}</span>
                            <span class="o-qty">${o.quantity}組</span>
                            <span class="o-amount">$${personalAmount}</span>
                            <button class="o-del" data-id="${o.id}">✕</button>
                        `;
                        const del = li.querySelector('.o-del');
                        del.addEventListener('click', () => deleteOrder(o.id));
                        ol.appendChild(li);
                    });
                }

                const form = body.querySelector('.add-form');
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const name = form.querySelector('.name-input').value;
                    const community = form.querySelector('.community-input').value;
                    const quantity = parseInt(form.querySelector('.qty-input').value) || 1;
                    if (await addOrder(p.id, name, community, quantity)) {
                        form.querySelector('.name-input').value = '';
                        form.querySelector('.community-input').value = '';
                        form.querySelector('.qty-input').value = '1';
                        form.querySelector('.name-input').focus();
                    }
                });

                card.appendChild(header);
                card.appendChild(body);
                productListEl.appendChild(card);
            });
        }

        // ===== 初始化 =====
        async function init() {
            loadCountdownsFromStorage();

            Object.keys(productCountdowns).forEach(key => {
                startProductCountdown(key);
            });

            await loadOrders();
            setInterval(loadOrders, 30000);

            resetBtn.addEventListener('click', resetAll);
            exportBtn.addEventListener('click', exportData);
            importBtn.addEventListener('click', importData);

            modalConfirm.addEventListener('click', () => {
                if (settingProductId) {
                    setProductCountdown(settingProductId, countdownDate.value);
                }
            });
            modalCancel.addEventListener('click', () => countdownModal.classList.remove('active'));
            countdownModal.addEventListener('click', (e) => {
                if (e.target === countdownModal) countdownModal.classList.remove('active');
            });
        }

        init();
    })();
</script>
</body>
</html>
