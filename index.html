<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>團購接龍 · 阿邦團購</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }
        .app {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            padding: 20px 16px 24px;
            margin-top: 10px;
        }
        
        /* 商品資訊 - 完整顯示 */
        .product-info {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 20px;
            padding: 18px 18px;
            margin-bottom: 16px;
            border: 2px solid #f59e0b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .product-left { display: flex; flex-direction: column; gap: 2px; }
        .product-info .product-name { font-size: 1.3rem; font-weight: 700; color: #92400e; }
        .product-info .product-note { font-size: 0.8rem; color: #92400e; background: rgba(255,255,255,0.5); padding: 2px 12px; border-radius: 40px; display: inline-block; }
        .product-info .product-price { font-size: 1.6rem; font-weight: 800; color: #dc2626; background: rgba(255,255,255,0.7); padding: 6px 18px; border-radius: 40px; white-space: nowrap; border: 2px solid #dc2626; }
        .product-info .product-price small { font-size: 0.8rem; font-weight: 400; color: #78350f; }

        /* 標題 + 下拉選單 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #1e293b; }
        .header .order-count { background: #dbeafe; color: #2563eb; padding: 4px 14px; border-radius: 40px; font-size: 0.9rem; font-weight: 600; }
        .sync-status { font-size: 0.7rem; color: #22c55e; margin-left: 4px; }
        .sync-status.syncing { color: #f59e0b; }
        .sync-status.error { color: #ef4444; }

        /* 下拉選單按鈕 */
        .dropdown-wrapper { position: relative; display: inline-block; }
        .dropdown-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .dropdown-btn:active { transform: scale(0.92); background: #e2e8f0; }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: white;
            min-width: 160px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            z-index: 100;
            padding: 8px 0;
            border: 1px solid #e9edf2;
        }
        .dropdown-content.active { display: block; }
        .dropdown-content button {
            display: block;
            width: 100%;
            padding: 10px 18px;
            border: none;
            background: none;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            color: #1e293b;
        }
        .dropdown-content button:hover { background: #f1f5f9; }
        .dropdown-content button:active { background: #e2e8f0; }
        .dropdown-content .divider { height: 1px; background: #e9edf2; margin: 4px 12px; }

        /* 統計 */
        .stats { display: flex; justify-content: space-around; background: #f8fafc; border-radius: 16px; padding: 12px; margin-bottom: 16px; border: 1px solid #e9edf2; flex-wrap: wrap; gap: 8px; }
        .stats div { text-align: center; flex: 1; min-width: 60px; }
        .stats .number { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
        .stats .label { font-size: 0.75rem; color: #64748b; }

        /* 新增表單 */
        .add-form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .add-form input { flex: 1; min-width: 80px; padding: 12px 16px; border: 1.5px solid #e9edf2; border-radius: 60px; font-size: 0.95rem; background: #fafafa; outline: none; transition: 0.2s; }
        .add-form input:focus { border-color: #2563eb; background: #ffffff; }
        .add-form input[type="number"] { max-width: 80px; text-align: center; }
        .add-form .name-input { flex: 2; min-width: 100px; }
        .add-form .community-input { flex: 1.5; min-width: 80px; }
        .add-form button { padding: 12px 20px; background: #2563eb; border: none; color: white; border-radius: 60px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .add-form button:active { background: #1d4ed8; transform: scale(0.95); }
        .add-form button:disabled { background: #94a3b8; cursor: not-allowed; }

        /* 訂單清單 */
        .order-list { list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 480px; overflow-y: auto; padding-right: 2px; }
        .order-list li { background: #fafcff; border: 1px solid #edf2f7; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; transition: 0.15s; flex-wrap: wrap; }
        .order-list li:active { background: #f1f5f9; }
        .order-number { font-weight: 700; color: #94a3b8; font-size: 0.8rem; min-width: 28px; }
        .order-info { flex: 1; min-width: 0; }
        .order-name { font-weight: 600; color: #0f172a; font-size: 1rem; }
        .order-community { font-size: 0.75rem; color: #64748b; background: #f1f5f9; padding: 1px 10px; border-radius: 40px; display: inline-block; margin-left: 6px; }
        .order-quantity { background: #dbeafe; color: #2563eb; padding: 2px 12px; border-radius: 40px; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
        .order-amount { background: #fef3c7; color: #92400e; padding: 2px 12px; border-radius: 40px; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
        .order-actions button { background: transparent; border: none; width: 32px; height: 32px; border-radius: 40px; font-size: 1rem; cursor: pointer; background: #fee2e2; color: #b91c1c; transition: 0.15s; flex-shrink: 0; }
        .order-actions button:active { transform: scale(0.88); }

        .community-stats { background: #f8fafc; border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; border: 1px solid #e9edf2; }
        .community-stats .title { font-size: 0.8rem; font-weight: 600; color: #64748b; margin-bottom: 8px; }
        .community-stats .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .community-stats .tag { background: #eef2ff; color: #4338ca; padding: 4px 12px; border-radius: 40px; font-size: 0.8rem; font-weight: 500; }
        .community-stats .tag .count { background: #4338ca; color: white; padding: 0 6px; border-radius: 40px; margin-left: 4px; font-size: 0.7rem; }

        .empty-message { text-align: center; padding: 40px 10px; color: #a0aec0; border: 2px dashed #e2e8f0; border-radius: 40px; background: #fafafa; }
        .empty-message span { font-size: 2.5rem; display: block; margin-bottom: 8px; }

        .footer-note { margin-top: 16px; font-size: 0.75rem; color: #b9c1cc; text-align: center; border-top: 1px solid #f1f5f9; padding-top: 14px; }
        .footer-note .total-amount { font-weight: 700; color: #dc2626; font-size: 1.2rem; }
        .order-list::-webkit-scrollbar { width: 4px; }
        .order-list::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 20px; }
        .order-list::-webkit-scrollbar-thumb { background: #d1d9e6; border-radius: 20px; }

        /* 倒數視窗 */
        .countdown-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
        .countdown-modal.active { display: flex; }
        .countdown-modal .modal-content { background: white; border-radius: 32px; padding: 24px; max-width: 400px; width: 100%; }
        .countdown-modal .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; }
        .countdown-modal .modal-body { display: flex; flex-direction: column; gap: 12px; }
        .countdown-modal .modal-body label { font-size: 0.9rem; font-weight: 500; color: #475569; }
        .countdown-modal .modal-body input { padding: 12px 16px; border: 1.5px solid #e9edf2; border-radius: 12px; font-size: 1rem; outline: none; }
        .countdown-modal .modal-body input:focus { border-color: #2563eb; }
        .countdown-modal .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .countdown-modal .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .countdown-modal .modal-actions .btn-confirm { background: #2563eb; color: white; }
        .countdown-modal .modal-actions .btn-confirm:active { background: #1d4ed8; }
        .countdown-modal .modal-actions .btn-cancel { background: #f1f5f9; color: #475569; }
        .countdown-modal .modal-actions .btn-cancel:active { background: #e2e8f0; }

        /* 倒數顯示（在選單內） */
        .countdown-display {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
        }
        .countdown-display .time { color: #2563eb; font-weight: 700; }
        .countdown-display .time.expired { color: #ef4444; }

        @media (max-width: 420px) {
            .add-form { flex-direction: column; }
            .add-form input[type="number"] { max-width: 100%; }
            .product-info .product-price { font-size: 1.2rem; padding: 4px 12px; }
            .stats div { min-width: 50px; }
            .stats .number { font-size: 1.2rem; }
            .header { flex-direction: column; align-items: stretch; }
            .header-left { justify-content: center; }
            .order-list li { flex-wrap: wrap; justify-content: flex-end; }
            .dropdown-content { right: auto; left: 0; min-width: 180px; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 商品資訊 - 完整顯示 -->
    <div class="product-info">
        <div class="product-left">
            <div class="product-name">🥯 滿滿起司貝果</div>
            <div class="product-note">🎉 嚐鮮價！回饋給阿邦好友</div>
        </div>
        <div class="product-price">
            $120 <small>/ 3個</small>
        </div>
    </div>

    <!-- 標題 + 下拉選單 -->
    <div class="header">
        <div class="header-left">
            <h1>📋 團購接龍</h1>
            <span class="order-count" id="countBadge">0 人</span>
            <span class="sync-status" id="syncStatus">● 已同步</span>
        </div>
        <div class="dropdown-wrapper">
            <button class="dropdown-btn" id="dropdownBtn">⚙️ ▼</button>
            <div class="dropdown-content" id="dropdownContent">
                <!-- 倒數計時顯示 -->
                <div style="padding: 8px 18px; font-size: 0.85rem; color: #475569; border-bottom: 1px solid #e9edf2;">
                    <span>⏰ 倒數：</span>
                    <span id="dropdownCountdown" style="font-weight:700; color:#2563eb;">--:--:--</span>
                </div>
                <button id="setCountdownBtn">⏰ 設定倒數</button>
                <button id="resetBtn">⟳ 重置清單</button>
                <div class="divider"></div>
                <button id="exportBtn" style="color:#2563eb;">📤 匯出資料</button>
                <button id="importBtn" style="color:#2563eb;">📥 匯入資料</button>
            </div>
        </div>
    </div>

    <!-- 設定倒數視窗 -->
    <div class="countdown-modal" id="countdownModal">
        <div class="modal-content">
            <div class="modal-title">⏰ 設定倒數計時</div>
            <div class="modal-body">
                <label for="countdownDate">截止日期與時間</label>
                <input type="datetime-local" id="countdownDate">
                <div style="font-size:0.8rem; color:#94a3b8; margin-top:-4px;">💡 設定未來的時間，倒數會自動開始</div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">取消</button>
                <button class="btn-confirm" id="modalConfirm">設定</button>
            </div>
        </div>
    </div>

    <!-- 統計 -->
    <div class="stats">
        <div><div class="number" id="totalPeople">0</div><div class="label">👤 人數</div></div>
        <div><div class="number" id="totalQuantity">0</div><div class="label">🥯 總數量</div></div>
        <div><div class="number" id="totalPrice">0</div><div class="label">💰 總金額</div></div>
    </div>

    <!-- 社區統計 -->
    <div class="community-stats">
        <div class="title">🏘️ 各社區統計</div>
        <div class="tags" id="communityTags"><span style="color:#94a3b8; font-size:0.8rem;">載入中...</span></div>
    </div>

    <!-- 新增訂單 -->
    <form class="add-form" id="addForm">
        <input type="text" id="nameInput" class="name-input" placeholder="輸入姓名..." required>
        <input type="text" id="communityInput" class="community-input" placeholder="社區名稱..." required>
        <input type="number" id="quantityInput" placeholder="數量" value="1" min="1" max="99">
        <button type="submit" id="submitBtn">＋ 加入</button>
    </form>

    <!-- 訂單清單 -->
    <ul class="order-list" id="orderList"></ul>

    <!-- 底部 -->
    <div class="footer-note">
        總金額 <span class="total-amount" id="totalAmountDisplay">0</span> 元
        · 點擊 ✕ 刪除訂單 · <span id="lastUpdated">即時同步</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        const API_URL = 'https://script.google.com/macros/s/AKfycbxnLPTMQXAsiMOyOSkswK3124epzO6TQUxyUClRXBaSHq6Ouc6tuMFH5CcwRAvf8EzW1Q/exec';

        const PRODUCT = { name: '滿滿起司貝果', price: 120, unit: 3 };
        const UNIT_PRICE = PRODUCT.price / PRODUCT.unit;

        let orders = [];
        let countdownEnd = null;
        let countdownInterval = null;
        let isExpired = false;
        let isLoading = false;

        // DOM
        const orderListEl = document.getElementById('orderList');
        const addForm = document.getElementById('addForm');
        const nameInput = document.getElementById('nameInput');
        const communityInput = document.getElementById('communityInput');
        const quantityInput = document.getElementById('quantityInput');
        const submitBtn = document.getElementById('submitBtn');
        const totalPeople = document.getElementById('totalPeople');
        const totalQuantity = document.getElementById('totalQuantity');
        const totalPrice = document.getElementById('totalPrice');
        const totalAmountDisplay = document.getElementById('totalAmountDisplay');
        const countBadge = document.getElementById('countBadge');
        const resetBtn = document.getElementById('resetBtn');
        const communityTags = document.getElementById('communityTags');
        const syncStatus = document.getElementById('syncStatus');
        const lastUpdated = document.getElementById('lastUpdated');
        const dropdownBtn = document.getElementById('dropdownBtn');
        const dropdownContent = document.getElementById('dropdownContent');
        const dropdownCountdown = document.getElementById('dropdownCountdown');

        // 倒數
        const countdownTime = document.getElementById('countdownTime');
        const setCountdownBtn = document.getElementById('setCountdownBtn');
        const countdownModal = document.getElementById('countdownModal');
        const countdownDate = document.getElementById('countdownDate');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');

        // ----- 下拉選單 -----
        dropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownContent.classList.toggle('active');
        });
        document.addEventListener('click', () => {
            dropdownContent.classList.remove('active');
        });

        // ----- API -----
        async function apiCall(action, params = {}) {
            const url = new URL(API_URL);
            url.searchParams.append('action', action);
            Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
            try {
                const response = await fetch(url.toString());
                return await response.json();
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        // ----- 載入 -----
        async function loadOrders() {
            if (isLoading) return;
            isLoading = true;
            syncStatus.textContent = '● 同步中';
            syncStatus.className = 'sync-status syncing';
            try {
                const result = await apiCall('getOrders');
                if (result.success && result.orders) {
                    orders = result.orders;
                    render();
                    syncStatus.textContent = '● 已同步';
                    syncStatus.className = 'sync-status';
                    lastUpdated.textContent = new Date().toLocaleTimeString();
                } else {
                    syncStatus.textContent = '● 錯誤';
                    syncStatus.className = 'sync-status error';
                }
            } catch (error) {
                syncStatus.textContent = '● 錯誤';
                syncStatus.className = 'sync-status error';
            }
            isLoading = false;
        }

        // ----- 新增 -----
        async function addOrder(name, community, quantity) {
            if (isExpired) { alert('⏰ 團購已截止'); return false; }
            const trimmedName = name.trim();
            const trimmedCommunity = community.trim();
            if (!trimmedName || !trimmedCommunity) return false;
            if (quantity < 1 || quantity > 99) return false;

            submitBtn.disabled = true;
            syncStatus.textContent = '● 儲存中';
            syncStatus.className = 'sync-status syncing';
            try {
                const result = await apiCall('addOrder', { name: trimmedName, community: trimmedCommunity, quantity });
                if (result.success) { await loadOrders(); return true; }
                else { alert('新增失敗: ' + (result.error || '請稍後再試')); return false; }
            } catch (error) { alert('網路錯誤'); return false; }
            finally { submitBtn.disabled = false; }
        }

        // ----- 刪除 -----
        async function deleteOrder(id) {
            syncStatus.textContent = '● 刪除中';
            syncStatus.className = 'sync-status syncing';
            try {
                const result = await apiCall('deleteOrder', { id });
                if (result.success) await loadOrders();
                else alert('刪除失敗');
            } catch (error) { alert('網路錯誤'); }
        }

        // ----- 重置 -----
        async function resetAll() {
            if (orders.length === 0) return;
            if (!confirm('確定要清空所有訂單嗎？')) return;
            syncStatus.textContent = '● 重置中';
            syncStatus.className = 'sync-status syncing';
            try {
                const result = await apiCall('reset');
                if (result.success) await loadOrders();
                else alert('重置失敗');
            } catch (error) { alert('網路錯誤'); }
        }

        // ----- 倒數 -----
        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            updateCountdownDisplay();
            countdownInterval = setInterval(updateCountdownDisplay, 1000);
        }

        function updateCountdownDisplay() {
            if (!countdownEnd) {
                countdownTime.textContent = '--:--:--';
                dropdownCountdown.textContent = '--:--:--';
                submitBtn.disabled = false;
                return;
            }
            const now = new Date();
            const diff = countdownEnd - now;
            if (diff <= 0) {
                countdownTime.textContent = '⏰ 已截止';
                dropdownCountdown.textContent = '⏰ 已截止';
                countdownTime.className = 'time expired';
                dropdownCountdown.className = 'time expired';
                submitBtn.disabled = true;
                isExpired = true;
                if (countdownInterval) clearInterval(countdownInterval);
                return;
            }
            isExpired = false;
            submitBtn.disabled = false;
            const h = String(Math.floor(diff / (1000*60*60))).padStart(2, '0');
            const m = String(Math.floor((diff % (1000*60*60)) / (1000*60))).padStart(2, '0');
            const s = String(Math.floor((diff % (1000*60)) / 1000)).padStart(2, '0');
            const text = `${h}:${m}:${s}`;
            countdownTime.textContent = text;
            dropdownCountdown.textContent = text;
            countdownTime.className = 'time';
            dropdownCountdown.className = 'time';
        }

        function setCountdown(dateTime) {
            const target = new Date(dateTime);
            if (isNaN(target.getTime()) || target <= new Date()) {
                alert('請選擇未來的有效時間');
                return;
            }
            countdownEnd = target;
            localStorage.setItem('countdownEnd', countdownEnd.toISOString());
            startCountdown();
            countdownModal.classList.remove('active');
            dropdownContent.classList.remove('active');
        }

        // ----- 匯出 -----
        function exportData() {
            if (orders.length === 0) { alert('清單是空的'); return; }
            const data = JSON.stringify({ orders, nextId: 1, exportedAt: new Date().toISOString() }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `團購訂單-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            dropdownContent.classList.remove('active');
        }

        // ----- 匯入 -----
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.orders && Array.isArray(data.orders)) {
                            if (confirm(`將匯入 ${data.orders.length} 個項目，是否取代目前清單？`)) {
                                // 透過 API 一筆一筆新增
                                (async () => {
                                    for (const order of data.orders) {
                                        await apiCall('addOrder', {
                                            name: order.name,
                                            community: order.community || '未填寫',
                                            quantity: order.quantity
                                        });
                                    }
                                    await loadOrders();
                                    alert('匯入成功！');
                                })();
                            }
                        } else {
                            alert('檔案格式錯誤');
                        }
                    } catch (_) { alert('無法讀取檔案'); }
                };
                reader.readAsText(file);
            };
            input.click();
            dropdownContent.classList.remove('active');
        }

        // ----- 渲染 -----
        function render() {
            const totalPeopleCount = orders.length;
            const totalQty = orders.reduce((sum, o) => sum + o.quantity, 0);
            const totalAmt = totalQty * UNIT_PRICE;

            totalPeople.textContent = totalPeopleCount;
            totalQuantity.textContent = totalQty;
            totalPrice.textContent = totalAmt;
            totalAmountDisplay.textContent = totalAmt;
            countBadge.textContent = totalPeopleCount + ' 人';

            const stats = {};
            orders.forEach(o => {
                const c = o.community || '未填寫';
                if (!stats[c]) stats[c] = { people: 0, quantity: 0, amount: 0 };
                stats[c].people += 1;
                stats[c].quantity += o.quantity;
                stats[c].amount += o.quantity * UNIT_PRICE;
            });
            const keys = Object.keys(stats);
            if (keys.length === 0) {
                communityTags.innerHTML = '<span style="color:#94a3b8; font-size:0.8rem;">尚無訂單</span>';
            } else {
                communityTags.innerHTML = keys.map(key => {
                    const s = stats[key];
                    return `<span class="tag">${key} <span class="count">${s.people}人 / ${s.quantity}個 / $${s.amount}</span></span>`;
                }).join('');
            }

            orderListEl.innerHTML = '';
            if (orders.length === 0) {
                orderListEl.innerHTML = `<div class="empty-message"><span>🛒</span><p>還沒有訂單，快來+1吧！</p></div>`;
                return;
            }
            orders.forEach((order, index) => {
                const amount = order.quantity * UNIT_PRICE;
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="order-number">#${index + 1}</span>
                    <div class="order-info">
                        <span class="order-name">${order.name}</span>
                        <span class="order-community">🏘️ ${order.community || '未填寫'}</span>
                    </div>
                    <span class="order-quantity">+ ${order.quantity}</span>
                    <span class="order-amount">$${amount}</span>
                    <div class="order-actions">
                        <button data-id="${order.id}">✕</button>
                    </div>
                `;
                const deleteBtn = li.querySelector('button');
                deleteBtn.addEventListener('click', () => deleteOrder(order.id));
                orderListEl.appendChild(li);
            });
        }

        // ----- 初始化 -----
        async function init() {
            const saved = localStorage.getItem('countdownEnd');
            if (saved) {
                const d = new Date(saved);
                if (d > new Date()) { countdownEnd = d; startCountdown(); }
                else { localStorage.removeItem('countdownEnd'); }
            }

            await loadOrders();
            setInterval(loadOrders, 30000);

            addForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = nameInput.value;
                const community = communityInput.value;
                const quantity = parseInt(quantityInput.value) || 1;
                if (await addOrder(name, community, quantity)) {
                    nameInput.value = '';
                    communityInput.value = '';
                    nameInput.focus();
                    quantityInput.value = '1';
                }
            });

            resetBtn.addEventListener('click', resetAll);

            setCountdownBtn.addEventListener('click', () => {
                const now = new Date();
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                tomorrow.setHours(20, 0, 0, 0);
                const y = tomorrow.getFullYear();
                const m = String(tomorrow.getMonth() + 1).padStart(2, '0');
                const d = String(tomorrow.getDate()).padStart(2, '0');
                const h = String(tomorrow.getHours()).padStart(2, '0');
                const min = String(tomorrow.getMinutes()).padStart(2, '0');
                countdownDate.value = `${y}-${m}-${d}T${h}:${min}`;
                countdownModal.classList.add('active');
                dropdownContent.classList.remove('active');
            });

            modalConfirm.addEventListener('click', () => setCountdown(countdownDate.value));
            modalCancel.addEventListener('click', () => countdownModal.classList.remove('active'));
            countdownModal.addEventListener('click', (e) => {
                if (e.target === countdownModal) countdownModal.classList.remove('active');
            });

            exportBtn.addEventListener('click', exportData);
            importBtn.addEventListener('click', importData);

            // 快捷鍵
            nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); communityInput.focus(); } });
            communityInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); quantityInput.focus(); } });
            quantityInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addForm.dispatchEvent(new Event('submit')); } });
        }

        init();
    })();
</script>
</body>
</html>
