<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>團購接龍 · 阿邦團購</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }

        .app {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            padding: 20px 16px 24px;
            margin-top: 10px;
        }

        /* 商品資訊 */
        .product-info {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 20px;
            border: 2px solid #f59e0b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .product-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-info .product-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #92400e;
        }

        .product-info .product-note {
            font-size: 0.8rem;
            color: #92400e;
            background: rgba(255,255,255,0.5);
            padding: 2px 12px;
            border-radius: 40px;
            display: inline-block;
        }

        .product-info .product-price {
            font-size: 1.4rem;
            font-weight: 800;
            color: #dc2626;
            background: rgba(255,255,255,0.7);
            padding: 6px 16px;
            border-radius: 40px;
            white-space: nowrap;
            border: 2px solid #dc2626;
        }

        .product-info .product-price small {
            font-size: 0.8rem;
            font-weight: 400;
            color: #78350f;
        }

        /* 標題 + 倒數計時 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
        }

        .header .order-count {
            background: #dbeafe;
            color: #2563eb;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .header-actions button {
            background: #f1f5f9;
            border: none;
            padding: 8px 12px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .header-actions button:active {
            transform: scale(0.92);
        }

        /* 倒數計時器 */
        .countdown {
            background: #1e293b;
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .countdown .icon {
            font-size: 1rem;
        }

        .countdown .time {
            color: #fcd34d;
            font-size: 1.1rem;
        }

        .countdown .time.expired {
            color: #f87171;
        }

        .countdown .set-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .countdown .set-btn:active {
            background: rgba(255,255,255,0.3);
        }

        /* 設定倒數視窗 */
        .countdown-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .countdown-modal.active {
            display: flex;
        }

        .countdown-modal .modal-content {
            background: white;
            border-radius: 32px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
        }

        .countdown-modal .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .countdown-modal .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .countdown-modal .modal-body label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #475569;
        }

        .countdown-modal .modal-body input {
            padding: 12px 16px;
            border: 1.5px solid #e9edf2;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        .countdown-modal .modal-body input:focus {
            border-color: #2563eb;
        }

        .countdown-modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .countdown-modal .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .countdown-modal .modal-actions .btn-confirm {
            background: #2563eb;
            color: white;
        }

        .countdown-modal .modal-actions .btn-confirm:active {
            background: #1d4ed8;
        }

        .countdown-modal .modal-actions .btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .countdown-modal .modal-actions .btn-cancel:active {
            background: #e2e8f0;
        }

        /* 統計 */
        .stats {
            display: flex;
            justify-content: space-around;
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #e9edf2;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stats div {
            text-align: center;
            flex: 1;
            min-width: 60px;
        }

        .stats .number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
        }

        .stats .label {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* 新增表單 */
        .add-form {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .add-form input {
            flex: 1;
            min-width: 80px;
            padding: 12px 16px;
            border: 1.5px solid #e9edf2;
            border-radius: 60px;
            font-size: 0.95rem;
            background: #fafafa;
            outline: none;
            transition: 0.2s;
        }

        .add-form input:focus {
            border-color: #2563eb;
            background: #ffffff;
        }

        .add-form input[type="number"] {
            max-width: 80px;
            text-align: center;
        }

        .add-form .name-input {
            flex: 2;
            min-width: 100px;
        }

        .add-form .community-input {
            flex: 1.5;
            min-width: 80px;
        }

        .add-form button {
            padding: 12px 20px;
            background: #2563eb;
            border: none;
            color: white;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .add-form button:active {
            background: #1d4ed8;
            transform: scale(0.95);
        }

        .add-form button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* 訂單清單 */
        .order-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .order-list li {
            background: #fafcff;
            border: 1px solid #edf2f7;
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.15s;
        }

        .order-list li:active {
            background: #f1f5f9;
        }

        .order-number {
            font-weight: 700;
            color: #94a3b8;
            font-size: 0.8rem;
            min-width: 28px;
        }

        .order-info {
            flex: 1;
            min-width: 0;
        }

        .order-name {
            font-weight: 600;
            color: #0f172a;
            font-size: 1rem;
        }

        .order-community {
            font-size: 0.75rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 1px 10px;
            border-radius: 40px;
            display: inline-block;
            margin-left: 6px;
        }

        .order-quantity {
            background: #dbeafe;
            color: #2563eb;
            padding: 2px 12px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .order-actions button {
            background: transparent;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            background: #fee2e2;
            color: #b91c1c;
            transition: 0.15s;
            flex-shrink: 0;
        }

        .order-actions button:active {
            transform: scale(0.88);
        }

        /* 社區統計 */
        .community-stats {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #e9edf2;
        }

        .community-stats .title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }

        .community-stats .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .community-stats .tag {
            background: #eef2ff;
            color: #4338ca;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .community-stats .tag .count {
            background: #4338ca;
            color: white;
            padding: 0 6px;
            border-radius: 40px;
            margin-left: 4px;
            font-size: 0.7rem;
        }

        /* 空狀態 */
        .empty-message {
            text-align: center;
            padding: 40px 10px;
            color: #a0aec0;
            border: 2px dashed #e2e8f0;
            border-radius: 40px;
            background: #fafafa;
        }

        .empty-message span {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }

        /* 底部 */
        .footer-note {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #b9c1cc;
            text-align: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 14px;
        }

        .footer-note .total-amount {
            font-weight: 700;
            color: #dc2626;
            font-size: 1.2rem;
        }

        .order-list::-webkit-scrollbar {
            width: 4px;
        }
        .order-list::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 20px;
        }
        .order-list::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 20px;
        }

        @media (max-width: 420px) {
            .add-form { flex-direction: column; }
            .add-form input[type="number"] { max-width: 100%; }
            .product-info .product-price { font-size: 1.1rem; padding: 4px 12px; }
            .stats div { min-width: 50px; }
            .stats .number { font-size: 1.2rem; }
            .header { flex-direction: column; align-items: stretch; }
            .countdown { justify-content: center; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 商品資訊 -->
    <div class="product-info">
        <div class="product-left">
            <div class="product-name">🥯 滿滿起司貝果</div>
            <div class="product-note">🎉 嚐鮮價！回饋給阿邦好友</div>
        </div>
        <div class="product-price">
            $120 <small>/ 3個</small>
        </div>
    </div>

    <!-- 標題 + 倒數計時 -->
    <div class="header">
        <div class="header-left">
            <h1>📋 團購接龍</h1>
            <span class="order-count" id="countBadge">0 人</span>
        </div>
        <div class="header-actions">
            <div class="countdown" id="countdownDisplay">
                <span class="icon">⏰</span>
                <span class="time" id="countdownTime">--:--:--</span>
                <button class="set-btn" id="setCountdownBtn">設定</button>
            </div>
            <button id="resetBtn" title="重置">⟳</button>
        </div>
    </div>

    <!-- 設定倒數視窗 -->
    <div class="countdown-modal" id="countdownModal">
        <div class="modal-content">
            <div class="modal-title">⏰ 設定倒數計時</div>
            <div class="modal-body">
                <label for="countdownDate">截止日期與時間</label>
                <input type="datetime-local" id="countdownDate">
                <div style="font-size:0.8rem; color:#94a3b8; margin-top:-4px;">
                    💡 設定未來的時間，倒數會自動開始
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">取消</button>
                <button class="btn-confirm" id="modalConfirm">設定</button>
            </div>
        </div>
    </div>

    <!-- 統計 -->
    <div class="stats">
        <div>
            <div class="number" id="totalPeople">0</div>
            <div class="label">👤 人數</div>
        </div>
        <div>
            <div class="number" id="totalQuantity">0</div>
            <div class="label">🥯 總數量</div>
        </div>
        <div>
            <div class="number" id="totalPrice">0</div>
            <div class="label">💰 總金額</div>
        </div>
    </div>

    <!-- 社區統計 -->
    <div class="community-stats" id="communityStats">
        <div class="title">🏘️ 各社區統計</div>
        <div class="tags" id="communityTags">
            <span style="color:#94a3b8; font-size:0.8rem;">尚無訂單</span>
        </div>
    </div>

    <!-- 新增訂單 -->
    <form class="add-form" id="addForm">
        <input type="text" id="nameInput" class="name-input" placeholder="輸入姓名..." required>
        <input type="text" id="communityInput" class="community-input" placeholder="社區名稱..." required>
        <input type="number" id="quantityInput" placeholder="數量" value="1" min="1" max="99">
        <button type="submit" id="submitBtn">＋ 加入</button>
    </form>

    <!-- 訂單清單 -->
    <ul class="order-list" id="orderList"></ul>

    <!-- 底部 -->
    <div class="footer-note">
        總金額 <span class="total-amount" id="totalAmountDisplay">0</span> 元
        · 點擊 ✕ 刪除訂單
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ----- 商品設定 -----
        const PRODUCT = {
            name: '滿滿起司貝果',
            price: 120,
            unit: 3
        };

        // ----- 狀態 -----
        let orders = [];
        let nextId = 1;
        let countdownEnd = null;        // 倒數結束時間 (Date 物件)
        let countdownInterval = null;
        let isExpired = false;

        // ----- DOM -----
        const orderListEl = document.getElementById('orderList');
        const addForm = document.getElementById('addForm');
        const nameInput = document.getElementById('nameInput');
        const communityInput = document.getElementById('communityInput');
        const quantityInput = document.getElementById('quantityInput');
        const submitBtn = document.getElementById('submitBtn');
        const totalPeople = document.getElementById('totalPeople');
        const totalQuantity = document.getElementById('totalQuantity');
        const totalPrice = document.getElementById('totalPrice');
        const totalAmountDisplay = document.getElementById('totalAmountDisplay');
        const countBadge = document.getElementById('countBadge');
        const resetBtn = document.getElementById('resetBtn');
        const communityTags = document.getElementById('communityTags');

        // 倒數相關 DOM
        const countdownTime = document.getElementById('countdownTime');
        const setCountdownBtn = document.getElementById('setCountdownBtn');
        const countdownModal = document.getElementById('countdownModal');
        const countdownDate = document.getElementById('countdownDate');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');

        // ----- 儲存 -----
        function saveToStorage() {
            try {
                const data = {
                    orders: orders,
                    nextId: nextId,
                    countdownEnd: countdownEnd ? countdownEnd.toISOString() : null
                };
                localStorage.setItem('groupBuyOrders', JSON.stringify(data));
            } catch (_) {}
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem('groupBuyOrders');
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (data.orders && Array.isArray(data.orders) && typeof data.nextId === 'number') {
                    orders = data.orders;
                    nextId = data.nextId;
                    if (data.countdownEnd) {
                        countdownEnd = new Date(data.countdownEnd);
                        if (countdownEnd > new Date()) {
                            startCountdown();
                        } else {
                            countdownEnd = null;
                        }
                    }
                    return true;
                }
            } catch (_) {}
            return false;
        }

        // ----- 倒數計時 -----
        function startCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            updateCountdownDisplay();

            countdownInterval = setInterval(() => {
                updateCountdownDisplay();
            }, 1000);
        }

        function updateCountdownDisplay() {
            if (!countdownEnd) {
                countdownTime.textContent = '--:--:--';
                countdownTime.className = 'time';
                submitBtn.disabled = false;
                return;
            }

            const now = new Date();
            const diff = countdownEnd - now;

            if (diff <= 0) {
                countdownTime.textContent = '⏰ 已截止';
                countdownTime.className = 'time expired';
                submitBtn.disabled = true;
                isExpired = true;
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                return;
            }

            isExpired = false;
            submitBtn.disabled = false;

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const h = String(hours).padStart(2, '0');
            const m = String(minutes).padStart(2, '0');
            const s = String(seconds).padStart(2, '0');

            countdownTime.textContent = `${h}:${m}:${s}`;
            countdownTime.className = 'time';
        }

        function setCountdown(dateTime) {
            const target = new Date(dateTime);
            if (isNaN(target.getTime())) {
                alert('請選擇有效的日期時間');
                return;
            }

            if (target <= new Date()) {
                alert('請選擇未來的時間');
                return;
            }

            countdownEnd = target;
            saveToStorage();
            startCountdown();
            countdownModal.classList.remove('active');
        }

        function clearCountdown() {
            countdownEnd = null;
            isExpired = false;
            submitBtn.disabled = false;
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            countdownTime.textContent = '--:--:--';
            countdownTime.className = 'time';
            saveToStorage();
        }

        // ----- 計算社區統計 -----
        function getCommunityStats() {
            const stats = {};
            orders.forEach(order => {
                const community = order.community || '未填寫';
                if (!stats[community]) {
                    stats[community] = { people: 0, quantity: 0 };
                }
                stats[community].people += 1;
                stats[community].quantity += order.quantity;
            });
            return stats;
        }

        // ----- 渲染 -----
        function render() {
            const totalPeopleCount = orders.length;
            const totalQty = orders.reduce((sum, o) => sum + o.quantity, 0);
            const totalAmt = totalQty * (PRODUCT.price / PRODUCT.unit);

            totalPeople.textContent = totalPeopleCount;
            totalQuantity.textContent = totalQty;
            totalPrice.textContent = totalAmt;
            totalAmountDisplay.textContent = totalAmt;
            countBadge.textContent = totalPeopleCount + ' 人';

            // 渲染社區統計
            const stats = getCommunityStats();
            const communityKeys = Object.keys(stats);
            if (communityKeys.length === 0) {
                communityTags.innerHTML = '<span style="color:#94a3b8; font-size:0.8rem;">尚無訂單</span>';
            } else {
                communityTags.innerHTML = communityKeys.map(key => {
                    const s = stats[key];
                    return `<span class="tag">${key} <span class="count">${s.people}人 / ${s.quantity}個</span></span>`;
                }).join('');
            }

            // 渲染訂單清單
            orderListEl.innerHTML = '';

            if (orders.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-message';
                emptyDiv.innerHTML = `<span>🛒</span><p>還沒有訂單，快來+1吧！</p>`;
                orderListEl.appendChild(emptyDiv);
                return;
            }

            orders.forEach((order, index) => {
                const li = document.createElement('li');

                const num = document.createElement('span');
                num.className = 'order-number';
                num.textContent = '#' + (index + 1);

                const info = document.createElement('div');
                info.className = 'order-info';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'order-name';
                nameSpan.textContent = order.name;

                const communitySpan = document.createElement('span');
                communitySpan.className = 'order-community';
                communitySpan.textContent = '🏘️ ' + (order.community || '未填寫');

                info.appendChild(nameSpan);
                info.appendChild(communitySpan);

                const qty = document.createElement('span');
                qty.className = 'order-quantity';
                qty.textContent = '+ ' + order.quantity;

                const actions = document.createElement('div');
                actions.className = 'order-actions';

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '✕';
                deleteBtn.addEventListener('click', () => deleteOrder(order.id));

                actions.appendChild(deleteBtn);

                li.appendChild(num);
                li.appendChild(info);
                li.appendChild(qty);
                li.appendChild(actions);

                orderListEl.appendChild(li);
            });
        }

        // ----- 操作 -----
        function addOrder(name, community, quantity) {
            if (isExpired) {
                alert('⏰ 團購已截止，無法新增訂單');
                return false;
            }

            const trimmedName = name.trim();
            const trimmedCommunity = community.trim();
            if (!trimmedName) return false;
            if (!trimmedCommunity) return false;
            if (quantity < 1 || quantity > 99) return false;

            orders.push({
                id: nextId++,
                name: trimmedName,
                community: trimmedCommunity,
                quantity: quantity
            });
            saveToStorage();
            render();
            return true;
        }

        function deleteOrder(id) {
            orders = orders.filter(o => o.id !== id);
            saveToStorage();
            render();
        }

        function resetAll() {
            if (orders.length === 0) return;
            if (confirm('確定要清空所有訂單嗎？')) {
                orders = [];
                nextId = 1;
                clearCountdown();
                saveToStorage();
                render();
            }
        }

        // ----- 初始化 -----
        function init() {
            const loaded = loadFromStorage();
            if (!loaded) {
                orders = [
                    { id: nextId++, name: '武篤英', community: '幸福社區', quantity: 2 },
                    { id: nextId++, name: '高麗莉', community: '陽光社區', quantity: 2 },
                    { id: nextId++, name: '陳大明', community: '幸福社區', quantity: 1 }
                ];
                saveToStorage();
            }
            render();

            // 如果有儲存的倒數，啟動
            if (countdownEnd) {
                startCountdown();
            }

            // 新增訂單
            addForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = nameInput.value;
                const community = communityInput.value;
                const quantity = parseInt(quantityInput.value) || 1;
                if (addOrder(name, community, quantity)) {
                    nameInput.value = '';
                    communityInput.value = '';
                    nameInput.focus();
                    quantityInput.value = '1';
                } else {
                    if (navigator.vibrate) navigator.vibrate(20);
                    if (!nameInput.value.trim()) {
                        nameInput.style.borderColor = '#dc2626';
                        setTimeout(() => nameInput.style.borderColor = '', 300);
                    } else if (!communityInput.value.trim()) {
                        communityInput.style.borderColor = '#dc2626';
                        setTimeout(() => communityInput.style.borderColor = '', 300);
                    }
                }
            });

            // 重置
            resetBtn.addEventListener('click', resetAll);

            // 設定倒數
            setCountdownBtn.addEventListener('click', () => {
                // 預設設定為明天晚上 8:00
                const now = new Date();
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                tomorrow.setHours(20, 0, 0, 0);
                
                const year = tomorrow.getFullYear();
                const month = String(tomorrow.getMonth() + 1).padStart(2, '0');
                const day = String(tomorrow.getDate()).padStart(2, '0');
                const hours = String(tomorrow.getHours()).padStart(2, '0');
                const minutes = String(tomorrow.getMinutes()).padStart(2, '0');
                countdownDate.value = `${year}-${month}-${day}T${hours}:${minutes}`;
                
                countdownModal.classList.add('active');
            });

            modalConfirm.addEventListener('click', () => {
                setCountdown(countdownDate.value);
            });

            modalCancel.addEventListener('click', () => {
                countdownModal.classList.remove('active');
            });

            // 點擊空白關閉 modal
            countdownModal.addEventListener('click', (e) => {
                if (e.target === countdownModal) {
                    countdownModal.classList.remove('active');
                }
            });

            // 快捷鍵
            nameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    communityInput.focus();
                }
            });

            communityInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    quantityInput.focus();
                }
            });

            quantityInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addForm.dispatchEvent(new Event('submit'));
                }
            });
        }

        init();
    })();
</script>
</body>
</html>
